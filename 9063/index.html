<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9063 · Loom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#e9e2cf; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(60,54,40,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another weaving</div>
<script>
'use strict';
/*
№9063 · Loom

No noise fields, no walkers, no dots. A purely geometric construction:
anchors are set on three nested ellipse rings, jittered once, and then
threads are strung between them. Each thread is a quadratic bezier whose
control point is pulled toward the centre by a seeded "tension" — slack
threads bow outward, taut ones cut straight across. Hundreds of
translucent iron-black and indigo threads cross and pile up into moire
densities near the middle; nine gold warp threads run over the top,
bold and deliberate, the way a weaver's pattern thread sits above the
weft. Bone ground, paper grain, full-bleed inside a quiet margin.
*/
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9063', 10) || 9063;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const GROUND = '#e9e2cf';
const MARG = 0.07;
const TAU = Math.PI * 2;

function draw(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const rng = mulberry32(seed);
  const rr = (a,b) => a + (b-a) * rng();
  const ri = (a,b) => Math.floor(rr(a, b+1));

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  const mx0 = W * MARG, my0 = H * MARG;
  const mx1 = W * (1 - MARG), my1 = H * (1 - MARG);
  const cx = W / 2, cy = H / 2;
  const R = Math.min(mx1 - mx0, my1 - my0) / 2;
  const ex = rr(1.05, 1.35);   // ellipse eccentricity (wider than tall)
  const ey = rr(0.72, 0.95);

  // clip everything to the margin rect
  ctx.save();
  ctx.beginPath();
  ctx.rect(mx0, my0, mx1 - mx0, my1 - my0);
  ctx.clip();

  // anchors on three nested ellipse rings
  const anchors = [];
  const rings = [
    { f: 0.94, n: ri(24, 30) },
    { f: 0.66, n: ri(18, 22) },
    { f: 0.40, n: ri(12, 16) },
  ];
  for (const ring of rings){
    const off = rr(0, TAU);
    for (let i = 0; i < ring.n; i++){
      const a = off + (i / ring.n) * TAU + rr(-0.03, 0.03);
      const rad = R * ring.f * rr(0.95, 1.05);
      anchors.push({ x: cx + Math.cos(a) * rad * ex, y: cy + Math.sin(a) * rad * ey, a });
    }
  }
  const nA = anchors.length;

  // threads: long first so crossings pile up over them
  const threads = [];
  const nThreads = ri(320, 400);
  for (let i = 0; i < nThreads; i++){
    const ia = ri(0, nA - 1);
    const ib = (ia + ri(7, nA - 7)) % nA;
    const A = anchors[ia], B = anchors[ib];
    const dx = B.x - A.x, dy = B.y - A.y;
    const len = Math.hypot(dx, dy);
    const tension = rr(-0.35, 0.9);      // negative = bows outward
    const indigo = rng() < 0.14;
    threads.push({ A, B, len, tension, indigo,
      alpha: rr(0.07, 0.15), w: rr(1.0, 2.0) });
  }
  threads.sort((p, q) => q.len - p.len);

  for (const t of threads){
    const mxp = (t.A.x + t.B.x) / 2, myp = (t.A.y + t.B.y) / 2;
    const qx = mxp + (cx - mxp) * t.tension;
    const qy = myp + (cy - myp) * t.tension;
    ctx.strokeStyle = t.indigo
      ? `rgba(46,64,87,${t.alpha.toFixed(3)})`
      : `rgba(28,26,22,${t.alpha.toFixed(3)})`;
    ctx.lineWidth = t.w;
    ctx.beginPath();
    ctx.moveTo(t.A.x, t.A.y);
    ctx.quadraticCurveTo(qx, qy, t.B.x, t.B.y);
    ctx.stroke();
  }

  // weft: dense local connections along each ring give the piece its woven bands
  let ringStart = 0;
  for (const ring of rings){
    for (let i = 0; i < ring.n; i++){
      const A = anchors[ringStart + i];
      const B = anchors[ringStart + ((i + 1) % ring.n)];
      const C = anchors[ringStart + ((i + 2) % ring.n)];
      for (const P of [B, C]){
        const mxp = (A.x + P.x) / 2, myp = (A.y + P.y) / 2;
        const t = rr(0.15, 0.5);
        ctx.strokeStyle = `rgba(28,26,22,${rr(0.10, 0.20).toFixed(3)})`;
        ctx.lineWidth = rr(1.0, 1.8);
        ctx.beginPath();
        ctx.moveTo(A.x, A.y);
        ctx.quadraticCurveTo(mxp + (cx - mxp) * t, myp + (cy - myp) * t, P.x, P.y);
        ctx.stroke();
      }
    }
    ringStart += ring.n;
  }

  // gold warp threads over the top
  for (let i = 0; i < 12; i++){
    const ia = ri(0, nA - 1);
    const ib = (ia + ri(10, nA - 10)) % nA;
    const A = anchors[ia], B = anchors[ib];
    const mxp = (A.x + B.x) / 2, myp = (A.y + B.y) / 2;
    const tension = rr(0.1, 0.75);
    ctx.strokeStyle = `rgba(172,124,44,${rr(0.45, 0.65).toFixed(3)})`;
    ctx.lineWidth = rr(2.2, 3.2);
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.quadraticCurveTo(mxp + (cx - mxp) * tension, myp + (cy - myp) * tension, B.x, B.y);
    ctx.stroke();
  }
  ctx.restore();

  // paper grain
  const grng = mulberry32(seed ^ 0x9e3779b9);
  ctx.fillStyle = 'rgba(60,50,35,0.05)';
  for (let i = 0; i < 3200; i++){
    ctx.fillRect(grng() * W, grng() * H, 1, 1);
  }
}

draw();

let resizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(draw, 150);
});
canvas.addEventListener('click', () => {
  seed = (seed * 1664525 + 1013904223) % 4294967296 || 1;
  draw();
});
</script>
</body>
</html>
