<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="jr-t jr-d">
<title id="jr-t">JotRelay — real-time shared notepad</title>
<desc id="jr-d">Midnight Blue hero: the JotRelay wordmark, a live-sync tagline, and two note cards mid-relay with presence indicators.</desc>
<defs>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#93c5fd"/>
    <stop offset="1" stop-color="#60a5fa"/>
  </linearGradient>
  <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.2"/>
    <stop offset="0.55" stop-color="#93c5fd" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0.2"/>
  </linearGradient>
</defs>

<!-- Canvas: Midnight Blue (default theme), soft blue glows like the landing page -->
<rect x="1" y="1" width="1198" height="628" rx="26" fill="#0c0e1a"/>
<rect x="-320" y="-200" width="920" height="580" fill="url(#glowA)"/>
<rect x="600" y="240" width="900" height="640" fill="url(#glowB)"/>
<rect x="1" y="1" width="1198" height="628" rx="26" fill="none" stroke="#252d4a" stroke-width="2"/>

<!-- ══ Left: product voice ══ -->
<g font-family="DM Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="96" y="78" width="330" height="46" rx="23" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.25)"/>
  <text x="128" y="107" font-size="18" letter-spacing="4" fill="#60a5fa">REAL-TIME NOTEPAD</text>
</g>

<text x="92" y="228" font-family="DM Sans, system-ui, sans-serif" font-size="112" font-weight="700" letter-spacing="-4" fill="#dde4f0">Jot<tspan fill="#60a5fa">Relay</tspan></text>

<text x="98" y="300" font-family="DM Mono, ui-monospace, Menlo, Consolas, monospace" font-size="27" fill="#7a87a8">/* notes and files, synced instantly */</text>
<text x="98" y="354" font-family="DM Sans, system-ui, sans-serif" font-size="24" fill="#7a87a8">Create a room, share the link — no account, no setup.</text>

<g font-family="DM Mono, ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#93c5fd">
  <rect x="96" y="404" width="206" height="48" rx="24" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.25)"/>
  <text x="124" y="434">live markdown</text>
  <rect x="316" y="404" width="252" height="48" rx="24" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.25)"/>
  <text x="344" y="434">presence &amp; typing</text>
  <rect x="582" y="404" width="196" height="48" rx="24" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.25)"/>
  <text x="610" y="434">~250 ms sync</text>
</g>

<text x="98" y="522" font-family="DM Mono, ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#3d4763">live demo → builtbysai.github.io/JotRelay</text>

<!-- ══ Right: the relay — two synced cards ══ -->
<g>
  <!-- presence chip, echoing the app's header -->
  <rect x="846" y="86" width="212" height="52" rx="26" fill="#111624" stroke="#252d4a" stroke-width="2"/>
  <circle cx="878" cy="112" r="9" fill="#4ade80"/>
  <text x="896" y="120" font-family="DM Sans, system-ui, sans-serif" font-size="22" font-weight="600" fill="#dde4f0">3 connected</text>

  <!-- back card: the other synced copy (outline only, like the product icon) -->
  <rect x="740" y="170" width="230" height="185" rx="28" fill="#111624" opacity="0.72" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="9"/>
  <rect x="770" y="214" width="140" height="15" rx="7.5" fill="#60a5fa" opacity="0.35"/>
  <rect x="770" y="244" width="140" height="15" rx="7.5" fill="#60a5fa" opacity="0.28"/>
  <rect x="770" y="274" width="94" height="15" rx="7.5" fill="#60a5fa" opacity="0.22"/>

  <!-- front card: primary, brand-blue -->
  <rect x="920" y="270" width="230" height="185" rx="28" fill="url(#cardGrad)"/>
  <rect x="954" y="318" width="140" height="17" rx="8.5" fill="#0c0e1a" opacity="0.42"/>
  <rect x="954" y="350" width="140" height="17" rx="8.5" fill="#0c0e1a" opacity="0.34"/>
  <rect x="954" y="382" width="98" height="17" rx="8.5" fill="#0c0e1a" opacity="0.28"/>

  <!-- relay signal: dotted arc carrying the edit from the back copy to the front,
       drawn over the cards so the dot lands ON the receiving card -->
  <path d="M 972 192 C 1062 196, 1090 248, 1062 272" fill="none" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 15"/>
  <circle cx="1062" cy="272" r="18" fill="#60a5fa" opacity="0.22"/>
  <circle cx="1062" cy="272" r="8" fill="#93c5fd"/>

  <!-- typing bubble -->
  <rect x="920" y="486" width="258" height="54" rx="20" fill="#111624" stroke="#252d4a" stroke-width="2"/>
  <circle cx="950" cy="513" r="8" fill="#60a5fa"/>
  <text x="967" y="521" font-family="DM Mono, ui-monospace, Menlo, Consolas, monospace" font-size="19" fill="#7a87a8">Priya is typing…</text>
</g>
</svg>
